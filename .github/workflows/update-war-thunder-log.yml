name: Update War Thunder log data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check out log data branch
        uses: actions/checkout@v4
        with:
          ref: warthunder-updates
          path: warthunder-updates

      - name: Fetch official changelog
        run: |
          cp scripts/update_warthunder_log.py warthunder-updates/scripts/update_warthunder_log.py
          python warthunder-updates/scripts/update_warthunder_log.py

      - name: Commit only changed log data
        run: |
          if git -C warthunder-updates diff --quiet -- war-thunder-updates.json; then
            echo "The update data has not changed."
            exit 0
          fi
          git -C warthunder-updates config user.name "github-actions[bot]"
          git -C warthunder-updates config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C warthunder-updates add -- war-thunder-updates.json
          git -C warthunder-updates commit -m "Update War Thunder log data"
          git -C warthunder-updates push origin HEAD:warthunder-updates